# Câmera "falsa" para os testes: o MediaMTX publica padrões de teste via RTSP.
paths:
  main:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel error -re
      -f lavfi -i testsrc2=size=1280x720:rate=25
      -f lavfi -i sine=frequency=440:sample_rate=48000
      -c:v libx264 -preset ultrafast -tune zerolatency -g 50 -pix_fmt yuv420p
      -c:a aac -b:a 64k
      -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  sub:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel error -re
      -f lavfi -i testsrc2=size=640x360:rate=15
      -c:v libx264 -preset ultrafast -tune zerolatency -g 30 -pix_fmt yuv420p
      -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  hevc:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel error -re
      -f lavfi -i testsrc2=size=1920x1080:rate=20
      -c:v libx265 -preset ultrafast -tune zerolatency -x265-params keyint=40:log-level=error -pix_fmt yuv420p
      -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
